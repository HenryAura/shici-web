<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>识词</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="识词">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icons/icon-1024.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="boot" class="boot"><div class="spinner"></div><p>正在加载词库…</p></div>

<main id="app" hidden>

  <section id="view-today" class="view">
    <header class="topbar">
      <div>
        <p class="date" id="date-line">—</p>
        <h1>今天</h1>
      </div>
      <button class="icon-btn" id="btn-theme" aria-label="切换深色">◐</button>
    </header>

    <div class="hero">
      <div class="hero-num" id="hero-num">0</div>
      <p class="hero-sub" id="hero-sub">今天没有待学的词</p>
    </div>

    <div class="stats">
      <div class="stat">
        <span class="stat-label">今日已答</span>
        <span class="stat-num" id="stat-done">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">剩余新词</span>
        <span class="stat-num" id="stat-new">0</span>
      </div>
    </div>

    <div class="card progress-card">
      <div class="row-between">
        <span class="card-title">今日进度</span>
        <span class="muted" id="progress-text">0 / 0</span>
      </div>
      <div class="bar"><i id="progress-fill"></i></div>
      <div class="row-between streak-row">
        <span class="muted">连续打卡</span>
        <span class="streak" id="streak">0 天</span>
      </div>
    </div>

    <div class="card">
      <div class="row-between">
        <span class="card-title">今日词表</span>
        <span class="muted" id="word-count">0</span>
      </div>
      <ul class="wordlist" id="wordlist"></ul>
    </div>

    <div class="cta-space"></div>
    <div class="cta-wrap">
      <button class="btn-primary" id="btn-start">开始学习</button>
    </div>
  </section>

  <section id="view-study" class="view" hidden>
    <header class="topbar study-top">
      <button class="icon-btn" id="btn-quit" aria-label="退出">‹</button>
      <div class="study-progress">
        <div class="bar slim"><i id="study-fill"></i></div>
        <span class="muted" id="study-count">1 / 1</span>
      </div>
      <span class="mode-pill" id="mode-pill">新词</span>
    </header>

    <div class="quiz-card" id="quiz-card">
      <div class="word-head">
        <h2 class="word" id="q-word">—</h2>
        <button class="speak" id="btn-speak" aria-label="发音">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>
          </svg>
        </button>
      </div>
      <p class="phonetic" id="q-phonetic"></p>

      <div class="reveal-hint" id="reveal-hint">
        <button class="btn-ghost" id="btn-reveal">显示释义</button>
      </div>

      <div class="answer" id="answer" hidden>
        <ul class="senses" id="q-senses"></ul>
        <p class="en-def" id="q-endef"></p>
        <div class="fam" id="q-fam"></div>
      </div>

      <div class="meta" id="q-meta"></div>
    </div>

    <div class="grade-bar" id="grade-bar" hidden>
      <button class="grade wrong" data-grade="wrong"><b>不认识</b><span>重新开始</span></button>
      <button class="grade partial" data-grade="partial"><b>模糊</b><span>缩短间隔</span></button>
      <button class="grade full" data-grade="full"><b>认识</b><span>拉长间隔</span></button>
    </div>
  </section>

  <section id="view-done" class="view" hidden>
    <div class="done-wrap">
      <div class="done-check">✓</div>
      <h2>今天完成了</h2>
      <p class="muted" id="done-detail">共 0 个词</p>
      <button class="btn-primary" id="btn-back">回到今天</button>
    </div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
